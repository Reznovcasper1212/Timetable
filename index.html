<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>A/L Study Planner</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%233b6ef6'/%3E%3Cstop offset='100%25' stop-color='%235b8cff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='4' width='56' height='56' rx='16' fill='url(%23g)'/%3E%3Cpath d='M18 17h20a8 8 0 0 1 8 8v22H26a8 8 0 0 0-8 8V17z' fill='%23fff' fill-opacity='.98'/%3E%3Cpath d='M18 17h20a8 8 0 0 1 8 8v22H26a8 8 0 0 0-8 8V17z' fill='none' stroke='%23dbe6ff' stroke-width='2'/%3E%3Cpath d='M23 29h16M23 35h16M23 41h11' stroke='%233b6ef6' stroke-width='3' stroke-linecap='round'/%3E%3Ccircle cx='47' cy='16' r='7' fill='%23fff'/%3E%3Cpath d='M47 11.7l1.3 2.9 3.2.3-2.4 2.1.7 3.1-2.8-1.6-2.8 1.6.7-3.1-2.4-2.1 3.2-.3z' fill='%233b6ef6'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
:root{--bg:#f4f6fb;--surface:#fff;--surface-2:#f8fafc;--border:#e3e8ef;--text:#1f2937;--muted:#6b7280;--accent:#3b6ef6;--accent-soft:#e8efff;--danger:#e5484d;--success:#16a34a;--warning:#d97706;--shadow:0 2px 8px rgba(15,23,42,.06);--shadow-lg:0 8px 24px rgba(15,23,42,.1);--radius:12px;--radius-sm:8px}
[data-theme="dark"]{--bg:#0f1419;--surface:#1a2027;--surface-2:#232b34;--border:#2c3540;--text:#e6edf3;--muted:#8b96a5;--accent:#5b8cff;--accent-soft:#1e2b45;--danger:#ff6b6e;--success:#34d399;--warning:#fbbf24;--shadow:0 2px 8px rgba(0,0,0,.35);--shadow-lg:0 8px 24px rgba(0,0,0,.5)}
#app{display:flex;min-height:100vh}
.sidebar{width:240px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 12px;position:sticky;top:0;height:100vh;transition:transform .25s ease;z-index:40}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 16px}
.brand-logo{width:44px;height:44px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;overflow:hidden;flex-shrink:0}
.brand-logo img{width:100%;height:100%;object-fit:cover}
.brand-text{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.brand-text strong{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-text span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav-link{padding:9px 10px;border-radius:var(--radius-sm);color:var(--text);text-decoration:none;font-size:14px;transition:background .15s,color .15s}
.nav-link:hover{background:var(--surface-2)}
.nav-link.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sidebar-footer{padding-top:8px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:2px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30}
.topbar h1{font-size:18px;margin:0;flex:1}
.topbar-actions{color:var(--muted);font-size:13px}
.content{padding:6px 20px 20px;max-width:1400px;width:100%;margin:0 auto}
#menuToggle{display:none}
.btn{border:1px solid var(--border);background:var(--surface);color:var(--text);padding:8px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:14px;font-family:inherit;transition:background .15s,border-color .15s,transform .05s}
.btn:hover{background:var(--surface-2)}.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;border-color:transparent}.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.small{padding:5px 9px;font-size:12.5px}
.icon-btn{padding:8px;line-height:1}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card h3{margin:0 0 10px;font-size:15px}
.grid{display:grid;gap:14px}
.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.section-title{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.section-title h2,.section-title h3{font-size:16px;margin:0}
.muted{color:var(--muted);font-size:12.5px}
.empty{text-align:center;color:var(--muted);padding:28px 10px;font-size:14px;border:1px dashed var(--border);border-radius:var(--radius);background:var(--surface-2)}
label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
input,select,textarea{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 10px;font-family:inherit;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea{resize:vertical;min-height:80px}
.form-row{margin-bottom:12px}.form-row.inline{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar input[type="search"],.toolbar input[type="text"]{flex:1;min-width:180px}
.toolbar select{width:auto;min-width:130px}
.toolbar .tt-time{width:110px;min-width:0;padding:7px 8px}.toolbar .tt-time-select{width:auto;min-width:95px;padding:7px 8px}
.timetable-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);position:relative}
.timetable{border-collapse:collapse;width:100%;min-width:820px}
.timetable th,.timetable td{border:1px solid var(--border);padding:4px;vertical-align:top;font-size:12px}
.timetable th{background:var(--surface-2);font-weight:600;padding:8px 6px;position:sticky;top:0;z-index:2}
.timetable th.today,.timetable td.today-col{background:var(--accent-soft)}
.timetable .time-col{width:64px;text-align:right;color:var(--muted);padding-right:8px!important;font-variant-numeric:tabular-nums}
.timetable td.slot{height:30px;cursor:pointer;position:relative}
.timetable td.slot:hover{background:var(--surface-2)}
.event-chip{display:block;border-radius:6px;padding:3px 6px;font-size:11.5px;color:#fff;margin:1px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.event-chip small{opacity:.9;display:block;font-size:10px}
.now-line{position:absolute;height:2px;background:var(--danger);z-index:3;pointer-events:none}
.now-line::before{content:"";position:absolute;left:0;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-head{text-align:center;font-size:12px;font-weight:600;color:var(--muted);padding:6px 0;background:var(--surface-2);border-radius:var(--radius-sm)}
.cal-cell{min-height:100px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px;background:var(--surface);cursor:pointer;display:flex;flex-direction:column;transition:background .15s}
.cal-cell:hover{background:var(--surface-2)}
.cal-cell.other{opacity:.35;cursor:default;background:var(--surface-2)}
.cal-cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal-date{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
.cal-cell.today .cal-date{color:var(--accent)}
.cal-events{display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cal-event{font-size:10.5px;color:#fff;padding:2px 4px;border-radius:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 1px rgba(0,0,0,.2)}
.cal-more{font-size:10px;color:var(--muted);padding-left:4px}
@media(max-width:760px){.cal-cell{min-height:70px}.cal-event{font-size:9.5px;padding:1px 3px}.cal-head{font-size:10px}}
.formula-card{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.formula-card .fc-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.formula-card .fc-title{font-weight:600;font-size:14.5px}
.formula-card .fc-meta{color:var(--muted);font-size:12px;margin-top:2px}
.formula-render{background:var(--surface-2);border-radius:var(--radius-sm);padding:12px;margin:10px 0;text-align:center;overflow-x:auto;min-height:30px}
.formula-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.note-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.note-card.pinned{border-left:4px solid var(--warning)}
.note-card h4{margin:0 0 4px;font-size:14.5px}
.note-card .note-body{white-space:pre-wrap;font-size:13.5px;margin:8px 0;color:var(--text)}
.tag{display:inline-block;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);border-radius:999px;padding:1px 8px;font-size:11px;margin-right:4px}
.progress{background:var(--surface-2);border-radius:999px;height:8px;overflow:hidden;border:1px solid var(--border)}
.progress>span{display:block;height:100%;background:var(--accent);transition:width .3s}
.progress-row{display:flex;align-items:center;gap:10px;margin:8px 0}
.progress-row .pr-label{min-width:130px;font-size:13px}
.progress-row .pr-bar{flex:1}
.progress-row .pr-val{min-width:44px;text-align:right;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.stat .stat-label{color:var(--muted);font-size:12px}
.stat .stat-value{font-size:22px;font-weight:700;margin-top:4px}
.stat .stat-sub{color:var(--muted);font-size:12px;margin-top:2px}
.modal-root{position:fixed;inset:0;display:none;z-index:100;align-items:center;justify-content:center}
.modal-root.open{display:flex}
.modal-backdrop{position:absolute;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(2px)}
.modal{position:relative;background:var(--surface);color:var(--text);border-radius:var(--radius);box-shadow:var(--shadow-lg);width:min(560px,92vw);max-height:88vh;display:flex;flex-direction:column;border:1px solid var(--border);animation:pop .15s ease}
.modal.large{width:min(820px,95vw)}
.modal.small{width:min(420px,92vw)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:16px;margin:0}
.modal-body{padding:16px;overflow-y:auto}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
.toast-root{position:fixed;right:16px;bottom:16px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface);color:var(--text);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:var(--radius-sm);padding:10px 14px;box-shadow:var(--shadow-lg);font-size:13.5px;animation:slideIn .2s ease;max-width:320px}
.toast.success{border-left-color:var(--success)}.toast.error{border-left-color:var(--danger)}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:translateX(0);opacity:1}}
.q-row{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.q-row .q-num{min-width:48px;font-weight:600}
.photo-circle{width:80px;height:80px;border-radius:50%;overflow:hidden;background:var(--surface-2);border:2px solid var(--border);display:grid;place-items:center;font-size:28px;color:var(--muted);flex-shrink:0}
.photo-circle img{width:100%;height:100%;object-fit:cover}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35}
/* Gate (welcome / profile picker) */
#gateRoot{min-height:100vh;min-height:100dvh;background:radial-gradient(circle at top left, var(--accent-soft), transparent 34%),radial-gradient(circle at bottom right, rgba(99,102,241,.08), transparent 30%),var(--bg);}
.gate-wrap{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
.gate-shell{width:min(980px,100%);display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);background:var(--surface);border:1px solid var(--border);border-radius:22px;box-shadow:0 22px 60px rgba(15,23,42,.12);overflow:hidden}
.gate-hero{padding:42px;background:linear-gradient(145deg,var(--accent-soft),transparent 70%);display:flex;flex-direction:column;justify-content:space-between;min-height:560px}
.gate-brand{display:flex;align-items:center;gap:12px}
.gate-brand-mark{width:46px;height:46px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:800;box-shadow:0 10px 22px rgba(59,110,246,.22)}
.gate-brand-text strong{display:block;font-size:14px}.gate-brand-text span{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.gate-hero h2{font-size:34px;line-height:1.1;margin:30px 0 12px;letter-spacing:-.8px;max-width:460px}
.gate-hero p{margin:0;color:var(--muted);font-size:14px;max-width:460px}
.gate-features{display:grid;gap:10px;margin-top:24px}
.gate-feature{display:flex;gap:10px;align-items:center;color:var(--text);font-size:13px}
.gate-feature i{width:26px;height:26px;border-radius:8px;background:var(--surface);border:1px solid var(--border);display:grid;place-items:center;font-style:normal}
.gate-panel{padding:42px;display:flex;align-items:center}
.gate-card{width:100%;max-width:430px;margin:auto}
.gate-logo{width:54px;height:54px;border-radius:16px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:800;margin:0 0 18px;letter-spacing:-.5px;box-shadow:0 10px 22px rgba(59,110,246,.18)}
.gate-h1{font-size:27px;line-height:1.15;font-weight:750;text-align:left;margin:0 0 7px;letter-spacing:-.45px}
.gate-sub{text-align:left;color:var(--muted);font-size:13px;margin:0 0 24px}
.profile-btn{display:flex;align-items:center;gap:12px;padding:13px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:12px;cursor:pointer;font-family:inherit;color:var(--text);transition:background .15s,border-color .15s,transform .12s; margin-bottom:9px}
.profile-btn:hover{background:var(--surface-2);border-color:var(--accent);transform:translateY(-1px)}
.gate-panel .form-row{margin-bottom:14px}
.gate-panel input,.gate-panel select{min-height:46px}
.gate-panel .btn.primary{min-height:46px;font-weight:650}
.gate-note{margin-top:16px;font-size:11.5px;text-align:left}
.profile-btn:hover{background:var(--surface-2);border-color:var(--accent)}
.profile-avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:15px;flex-shrink:0;overflow:hidden}
.profile-avatar img{width:100%;height:100%;object-fit:cover}
.responsive-stack{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.responsive-grow{flex:1;min-width:240px}
.photo-actions{display:flex;gap:6px;margin-top:8px;flex-direction:column}
.photo-crop-wrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.photo-crop-canvas{width:min(100%,340px);height:auto;aspect-ratio:1;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface-2);display:block;touch-action:none;cursor:grab}
.photo-crop-canvas.dragging{cursor:grabbing}
.photo-crop-help{text-align:center;color:var(--muted);font-size:12.5px}
.photo-crop-zoom{width:min(100%,340px)}
.profile-avatar img,.photo-circle img{display:block}
img{max-width:100%}
button,input,select,textarea{max-width:100%}
.timetable-wrap,.modal-body,.content{min-width:0}
@media (max-width:900px){.sidebar{position:fixed;top:0;left:0;height:100vh;transform:translateX(-100%);box-shadow:var(--shadow-lg)}.sidebar.open{transform:translateX(0)}#menuToggle{display:inline-flex}.overlay.open{display:block}.grid.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}.content{max-width:100%}}
@media (max-width:760px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr}.content{padding:4px 12px 12px}.topbar{padding:10px 12px;gap:8px}.topbar h1{font-size:16px}.topbar-actions{font-size:11px;white-space:nowrap}.card{padding:13px}.gate-wrap{padding:10px;align-items:stretch}.gate-shell{grid-template-columns:1fr;border-radius:16px;min-height:calc(100dvh - 20px)}.gate-hero{display:none}.gate-panel{padding:24px 18px;align-items:flex-start}.gate-card{padding:4px 0;max-width:none}.gate-logo{margin-bottom:16px}.gate-h1{font-size:24px}.gate-sub{margin-bottom:20px}.form-row.inline{grid-template-columns:1fr}.form-actions{justify-content:stretch;flex-wrap:wrap}.form-actions .btn{flex:1;min-width:120px}.responsive-grow{min-width:0;width:100%}.photo-actions{flex-direction:row}.photo-actions .btn{flex:1}.photo-circle{width:76px;height:76px}.toolbar{align-items:stretch}.toolbar .btn,.toolbar select,.toolbar input{width:100%;min-width:0}.toolbar label{width:100%;justify-content:flex-start}.timetable{min-width:760px}.calendar-scroll{overflow-x:auto}.calendar-scroll .cal-grid{min-width:650px}.modal{width:calc(100vw - 20px);max-height:92vh}.modal-body{padding:13px}.modal-footer{padding:10px 13px;flex-wrap:wrap}.modal-footer .btn{flex:1;min-width:110px}}
@media (max-width:480px){body{font-size:14px}.topbar-actions{display:none}.gate-h1{font-size:23px}.stat .stat-value{font-size:20px}.section-title{gap:8px}.section-title .btn{white-space:nowrap}.profile-btn{padding:11px}.profile-avatar{width:36px;height:36px}.photo-actions{flex-direction:column}.photo-actions .btn{width:100%}input,select,textarea{font-size:16px}.content{padding-bottom:20px}.gate-panel{padding:22px 16px}.gate-shell{min-height:100dvh;border-radius:0;border-left:0;border-right:0}.topbar{position:sticky;top:0}}
@media (max-width:1100px) and (min-width:761px){.sidebar{width:220px}.content{padding:4px 16px 16px}.grid.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.cols-3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (orientation:landscape) and (max-width:900px){.content{padding:4px 12px 12px}.sidebar{width:250px}.gate-wrap{padding:12px}.gate-card{max-height:calc(100dvh - 24px);overflow:auto}}
@media print{.sidebar,.topbar,.toolbar,.sidebar-footer,.toast-root{display:none!important}.content{padding:0}.card{box-shadow:none;border:none}}


/* ============ LIBRARY CUSTOMIZATION ============ */
.lib-hero-actions{margin-top:12px;display:flex;gap:7px;flex-wrap:wrap}.lib-hero-actions .btn{border-color:color-mix(in srgb,var(--fm-accent) 35%,var(--border));color:var(--fm-accent);background:color-mix(in srgb,var(--fm-accent) 7%,var(--surface))}.nt-hero .lib-hero-actions .btn{border-color:color-mix(in srgb,var(--nt-accent) 35%,var(--border));color:var(--nt-accent);background:color-mix(in srgb,var(--nt-accent) 7%,var(--surface))}
.fm-hero,.nt-hero{position:relative;overflow:hidden;border-radius:var(--library-radius);padding:var(--library-pad);gap:var(--library-gap)}.fm-hero::before,.nt-hero::before{content:"";position:absolute;inset:auto -60px -80px auto;width:220px;height:220px;border-radius:50%;background:color-mix(in srgb,var(--fm-accent) 12%,transparent);pointer-events:none}.nt-hero::before{background:color-mix(in srgb,var(--nt-accent) 12%,transparent)}

<script>
/* ============ CLOUD AUTH / FIRESTORE (optional until Firebase config is supplied) ============ */
/*
  Replace the values below with the Firebase Web App config from your Firebase project.
  The Firebase web config is not a password/secret; security is enforced by Authentication
  and the Firestore rules supplied with this file.
*/
window.AL_STUDY_PLANNER_FIREBASE_CONFIG = window.AL_STUDY_PLANNER_FIREBASE_CONFIG || {
  apiKey: "PASTE_FIREBASE_API_KEY",
  authDomain: "PASTE_FIREBASE_AUTH_DOMAIN",
  projectId: "PASTE_FIREBASE_PROJECT_ID",
  storageBucket: "PASTE_FIREBASE_STORAGE_BUCKET",
  messagingSenderId: "PASTE_FIREBASE_MESSAGING_SENDER_ID",
  appId: "PASTE_FIREBASE_APP_ID"
};

window.ALStudyPlannerCloud = (() => {
  let readyResolve;
  const ready = new Promise(resolve => { readyResolve = resolve; });
  const cloud = { enabled:false, ready, user:null, error:null, authReady:ready };
  const cfg = window.AL_STUDY_PLANNER_FIREBASE_CONFIG || {};
  const values = Object.values(cfg).map(v => String(v || ""));
  const configured = values.length >= 6 && !values.some(v => !v || v.startsWith("PASTE_FIREBASE_"));
  if(!configured){ readyResolve(null); return cloud; }

  Promise.all([
    import("https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js"),
    import("https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js")
  ]).then(([appMod, authMod, fsMod]) => {
    const firebaseApp = appMod.initializeApp(cfg);
    const auth = authMod.getAuth(firebaseApp);
    const db = fsMod.getFirestore(firebaseApp);
    cloud.enabled = true;
    cloud.app = firebaseApp;
    cloud.auth = auth;
    cloud.db = db;
    cloud._authApi = authMod;
    cloud._fsApi = fsMod;
    cloud._readySettled = false;

    cloud.userReady = new Promise(resolve => {
      let first = true;
      authMod.onAuthStateChanged(auth, user => {
        cloud.user = user || null;
        if(first){ first = false; resolve(user || null); readyResolve(user || null); }
      });
    });

    const emailFor = username => `${String(username || "").trim().toLowerCase()}@accounts.alstudyplanner.com`;
    cloud.createAccount = async (username, password, profile, state) => {
      await authMod.setPersistence(auth, authMod.browserLocalPersistence);
      const cred = await authMod.createUserWithEmailAndPassword(auth, emailFor(username), password);
      const uid = cred.user.uid;
      try {
        await fsMod.setDoc(fsMod.doc(db, "users", uid), {
          profile: { ...profile, username: String(username || "").trim().toLowerCase() },
          state,
          updatedAt: fsMod.serverTimestamp()
        });
      } catch(err){
        try { await authMod.deleteUser(cred.user); } catch(cleanErr){}
        throw err;
      }
      cloud.user = cred.user;
      return cred.user;
    };

    cloud.signIn = async (username, password) => {
      await authMod.setPersistence(auth, authMod.browserLocalPersistence);
      const cred = await authMod.signInWithEmailAndPassword(auth, emailFor(username), password);
      cloud.user = cred.user;
      return cred.user;
    };

    cloud.load = async uid => {
      const snap = await fsMod.getDoc(fsMod.doc(db, "users", uid));
      return snap.exists() ? snap.data() : null;
    };

    cloud.save = async (uid, profile, state) => {
      await fsMod.setDoc(fsMod.doc(db, "users", uid), {
        profile: { ...profile },
        state,
        updatedAt: fsMod.serverTimestamp()
      }, { merge:true });
    };

    cloud.logout = async () => { await authMod.signOut(auth); cloud.user = null; };
    cloud.deleteAccount = async uid => {
      await fsMod.deleteDoc(fsMod.doc(db, "users", uid));
      if(auth.currentUser) await authMod.deleteUser(auth.currentUser);
      cloud.user = null;
    };

    readyResolve(null);
  }).catch(err => {
    cloud.error = err;
    readyResolve(null);
  });
  return cloud;
})();
</script>
<script>
/* ============ INDEXEDDB (photo storage) ============ */
const fileDB = {
  db: null,
  async open() {
    if (this.db) return this.db;
    return new Promise((res, rej) => {
      const req = indexedDB.open("alPlannerFiles", 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains("files")) db.createObjectStore("files", { keyPath: "id" });
      };
      req.onsuccess = e => { this.db = e.target.result; res(this.db); };
      req.onerror = e => rej(e);
    });
  },
  async put(entry) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction("files", "readwrite");
      tx.objectStore("files").put(entry);
      tx.oncomplete = () => res(entry);
      tx.onerror = e => rej(e);
    });
  },
  async get(id) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction("files", "readonly");
      const req = tx.objectStore("files").get(id);
      req.onsuccess = () => res(req.result);
      req.onerror = e => rej(e);
    });
  },
  async delete(id) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const tx = db.transaction("files", "readwrite");
      tx.objectStore("files").delete(id);
      tx.oncomplete = () => res();
      tx.onerror = e => rej(e);
    });
  }
};
function readFileAsArrayBuffer(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsArrayBuffer(file);
  });
}

/* ============ ROOT (accounts registry) ============ */
const ROOT_KEY = "alStudyPlanner.root.v1";
const memoryStore = new Map();
let root = { profiles: [], current: null };
let profileId = null;
let activeAuth = false;
let cloudProfile = null;
let storageWarningShown = false;

/* Some browsers/environments block localStorage for file:// pages or private/embedded contexts.
   Use a memory fallback so the app still works instead of dying on the login/profile screen. */
function storageGet(key){
  if(memoryStore.has(key)) return memoryStore.get(key);
  try { return localStorage.getItem(key); }
  catch(e){ return null; }
}
function storageSet(key, value){
  try {
    localStorage.setItem(key, value);
    memoryStore.delete(key);
    return true;
  } catch(e){
    memoryStore.set(key, String(value));
    return false;
  }
}
function storageRemove(key){
  try { localStorage.removeItem(key); } catch(e) {}
  memoryStore.delete(key);
}
function showStorageWarning(){
  if(storageWarningShown) return;
  storageWarningShown = true;
  setTimeout(() => toast("Browser storage is blocked. Changes will last until this tab is closed.", "error"), 0);
}

function loadRoot(){
  try { root = JSON.parse(storageGet(ROOT_KEY)) || {profiles:[], current:null}; }
  catch { root = {profiles:[], current:null}; }
  if(!root || typeof root !== "object" || Array.isArray(root)) root = {profiles:[], current:null};
  if(!Array.isArray(root.profiles)) root.profiles = [];
  root.profiles = root.profiles
    .filter(p => p && typeof p === "object" && String(p.id || "").trim() && String(p.name || "").trim())
    .map(p => ({
      id: String(p.id),
      name: String(p.name).trim(),
      username: String(p.username || "").trim().toLowerCase(),
      passHash: typeof p.passHash === "string" ? p.passHash : "",
      passSalt: typeof p.passSalt === "string" ? p.passSalt : "",
      stream: String(p.stream || ""),
      examYear: String(p.examYear || ""),
      photoData: typeof p.photoData === "string" ? p.photoData : "",
      createdAt: p.createdAt || new Date().toISOString()
    }));
  if(root.current && !root.profiles.find(p => p.id === root.current)) root.current = null;
}
function saveRoot(){
  const ok = storageSet(ROOT_KEY, JSON.stringify(root));
  if(!ok) showStorageWarning();
}
function profileDataKey(id){ return `alStudyPlanner.data.${id}`; }
function getActiveProfileMeta(){
  if(window.ALStudyPlannerCloud?.enabled && cloudProfile) return cloudProfile;
  return root.profiles.find(x => x.id === profileId) || null;
}
function hasAnyLocalProfiles(){ return Array.isArray(root.profiles) && root.profiles.length > 0; }
let cloudSaveChain = Promise.resolve();
let cloudSyncWarningShown = false;
function queueCloudSave(){
  if(!window.ALStudyPlannerCloud?.enabled || !activeAuth || !window.ALStudyPlannerCloud.user || !profileId || !state) return;
  const p = getActiveProfileMeta();
  if(!p) return;
  const payload = {
    username: p.username || "",
    name: p.name || state.settings.studentName || "",
    stream: p.stream || state.settings.stream || "",
    examYear: p.examYear || state.settings.examYear || "",
    photoData: state.settings.photoData || p.photoData || ""
  };
  cloudSaveChain = cloudSaveChain
    .then(() => window.ALStudyPlannerCloud.save(window.ALStudyPlannerCloud.user.uid, payload, state))
    .catch(err => {
      console.error("Cloud save failed:", err);
      if(!cloudSyncWarningShown){
        cloudSyncWarningShown = true;
        toast("Cloud sync failed. Check your internet connection.", "error");
      }
    });
}
async function flushCloudSave(){
  try { await cloudSaveChain; } catch(e){}
}
function normalizeUsername(v){
  return String(v || "").trim().toLowerCase().replace(/[^a-z0-9._-]/g, "");
}
function randomHex(bytes=16){
  const a = new Uint8Array(bytes);
  if(window.crypto?.getRandomValues) window.crypto.getRandomValues(a);
  else for(let i=0;i<a.length;i++) a[i] = Math.floor(Math.random()*256);
  return Array.from(a, b => b.toString(16).padStart(2,"0")).join("");
}
async function hashPassword(password, salt){
  const raw = new TextEncoder().encode(`${salt}\u0000${password}`);
  if(window.crypto?.subtle){
    const buf = await window.crypto.subtle.digest("SHA-256", raw);
    return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2,"0")).join("");
  }
  // Conservative fallback for older/incompatible local file environments.
  let h = 2166136261;
  for(const b of raw){ h ^= b; h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(16).padStart(8,"0");
}

const DEFAULT_STATE = {

  subjects:[],timetableEvents:[],formulas:[],notes:[],studySessions:[]
};
let state = null;
let currentRoute = "dashboard";

function cloneDefaultState(){
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function normalizeState(raw){
  const s = deepMerge(cloneDefaultState(), (raw && typeof raw === "object" && !Array.isArray(raw)) ? raw : {});
  if(!s.settings || typeof s.settings !== "object" || Array.isArray(s.settings)) s.settings = cloneDefaultState().settings;
  if(!s.settings.timetable || typeof s.settings.timetable !== "object" || Array.isArray(s.settings.timetable)) s.settings.timetable = cloneDefaultState().settings.timetable;
  if(!s.settings.library || typeof s.settings.library !== "object" || Array.isArray(s.settings.library)) s.settings.library = cloneDefaultState().settings.library;
  if(!Array.isArray(s.settings.deletedStarterSubjects)) s.settings.deletedStarterSubjects = [];
  s.settings.deletedStarterSubjects = [...new Set(s.settings.deletedStarterSubjects.map(normalizeSubjectName).filter(Boolean))];
  ["subjects","timetableEvents","formulas","notes","studySessions"].forEach(k => { if(!Array.isArray(s[k])) s[k] = []; });

  // Repair legacy/imported subject records so every subject can be selected safely.
  const usedSubjectIds = new Set();
  s.subjects = s.subjects.map((sub, index) => {
    const item = (sub && typeof sub === "object" && !Array.isArray(sub)) ? sub : {};
    let id = String(item.id || "").trim();
    if(!id || usedSubjectIds.has(id)) id = uid("sub") + "_" + index;
    usedSubjectIds.add(id);
    return {
      ...item,
      id,
      name: String(item.name || "").trim(),
      color: /^#[0-9a-fA-F]{6}$/.test(String(item.color || "")) ? item.color : "#3b6ef6",
      icon: String(item.icon || "📘")
    };
  }).filter(sub => sub.name);
  return s;
}

function deepMerge(t,s){
  for(const k of Object.keys(s)){
    const sv = s[k];
    if(sv && typeof sv === "object" && !Array.isArray(sv) && t[k] && typeof t[k] === "object" && !Array.isArray(t[k])) deepMerge(t[k],sv);
    else t[k] = sv;
  }
  return t;
}

function hexToRgba(hex,alpha){

}

function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ""));
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function cropPhotoFile(file){
  return new Promise(async resolve => {
    try {
      const src = await fileToDataURL(file);
      const img = new Image();
      img.decoding = "async";
      await new Promise((ok, bad) => { img.onload = ok; img.onerror = bad; img.src = src; });

      const W = 320, H = 320;
      const baseScale = Math.max(W / img.naturalWidth, H / img.naturalHeight);
      let scale = baseScale;
      let x = (W - img.naturalWidth * scale) / 2;
      let y = (H - img.naturalHeight * scale) / 2;
      const minScale = baseScale;
      const maxScale = baseScale * 3;
      let dragging = false, lastX = 0, lastY = 0;

      const clamp = () => {
        const iw = img.naturalWidth * scale, ih = img.naturalHeight * scale;
        x = iw <= W ? (W - iw) / 2 : Math.min(0, Math.max(W - iw, x));
        y = ih <= H ? (H - ih) / 2 : Math.min(0, Math.max(H - ih, y));
      };

      const draw = () => {
        const canvas = document.getElementById("photoCropCanvas");
        if(!canvas) return;
        const ctx = canvas.getContext("2d");
        if(!ctx) return;
        ctx.clearRect(0,0,W,H);
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--surface-2").trim() || "#eef1f5";
        ctx.fillRect(0,0,W,H);
        ctx.drawImage(img, x, y, img.naturalWidth * scale, img.naturalHeight * scale);
        ctx.strokeStyle = "rgba(255,255,255,.92)";
        ctx.lineWidth = 1;
        for(const p of [W/3, W*2/3]){ ctx.beginPath(); ctx.moveTo(p,0); ctx.lineTo(p,H); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0,p); ctx.lineTo(W,p); ctx.stroke(); }
        ctx.strokeStyle = "rgba(255,255,255,1)";
        ctx.lineWidth = 2;
        ctx.strokeRect(1,1,W-2,H-2);
      };

      const finish = value => { try{ closeModal(); }catch(_){} resolve(value || null); };

      openModal({
        title: "Crop Profile Photo",
        size: "small",
        bodyHTML: `<div class="photo-crop-wrap">
          <canvas id="photoCropCanvas" class="photo-crop-canvas" width="320" height="320" aria-label="Profile photo crop area"></canvas>
          <div class="photo-crop-help">Drag the photo to choose the part you want. Use the slider to zoom.</div>
          <input class="photo-crop-zoom" id="photoCropZoom" type="range" min="0" max="100" value="0" aria-label="Zoom photo" />
        </div>`,
        footerHTML: `<button class="btn ghost" id="photoCropCancel">Cancel</button><button class="btn primary" id="photoCropSave">Save Crop</button>`,
        onMount: (body, footer) => {
          const canvas = body.querySelector("#photoCropCanvas");
          const zoom = body.querySelector("#photoCropZoom");
          draw();

          const setScaleFromZoom = value => {
            const pct = Number(value) / 100;
            const centerX = x + (img.naturalWidth * scale) / 2;
            const centerY = y + (img.naturalHeight * scale) / 2;
            scale = minScale + (maxScale - minScale) * pct;
            x = centerX - (img.naturalWidth * scale) / 2;
            y = centerY - (img.naturalHeight * scale) / 2;
            clamp();
            draw();
          };

          canvas.addEventListener("pointerdown", e => {
            dragging = true;
            lastX = e.clientX; lastY = e.clientY;
            canvas.classList.add("dragging");
            canvas.setPointerCapture?.(e.pointerId);
          });
          canvas.addEventListener("pointermove", e => {
            if(!dragging) return;
            x += e.clientX - lastX; y += e.clientY - lastY;
            lastX = e.clientX; lastY = e.clientY;
            clamp(); draw();
          });
          const stopDrag = e => {
            dragging = false;
            canvas.classList.remove("dragging");
            try{ canvas.releasePointerCapture?.(e.pointerId); }catch(_){}
          };
          canvas.addEventListener("pointerup", stopDrag);
          canvas.addEventListener("pointercancel", stopDrag);
          zoom.addEventListener("input", e => setScaleFromZoom(e.target.value));

          footer.querySelector("#photoCropCancel").addEventListener("click", () => finish(null));
          footer.querySelector("#photoCropSave").addEventListener("click", () => {
            const out = document.createElement("canvas");
            out.width = 240; out.height = 240;
            const ctx = out.getContext("2d", { alpha:false });
            if(!ctx) return finish(null);
            const sx = Math.max(0, Math.min(img.naturalWidth - 1, -x / scale));
            const sy = Math.max(0, Math.min(img.naturalHeight - 1, -y / scale));
            const sw = Math.min(img.naturalWidth - sx, W / scale);
            const sh = Math.min(img.naturalHeight - sy, H / scale);
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0,0,240,240);
            ctx.drawImage(img, sx, sy, sw, sh, 0, 0, 240, 240);
            finish(out.toDataURL("image/jpeg", .82));
          });
        }
      });
    } catch(e){
      resolve(null);
    }
  });
}

async function makePhotoDataURL(file, maxSide=240, quality=.68){
  const src = await fileToDataURL(file);
  const img = new Image();
  img.decoding = "async";
  await new Promise((resolve,reject)=>{ img.onload=resolve; img.onerror=reject; img.src=src; });
  const sourceW = img.naturalWidth || img.width || 1;
  const sourceH = img.naturalHeight || img.height || 1;
  const scale = Math.min(1, maxSide / Math.max(sourceW, sourceH));
  const w = Math.max(1, Math.round(sourceW * scale));
  const h = Math.max(1, Math.round(sourceH * scale));
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d", { alpha:false });
  if(!ctx) throw new Error("Canvas unavailable");
  ctx.drawImage(img, 0, 0, w, h);
  let out = canvas.toDataURL("image/jpeg", quality);
  // Keep the registry thumbnail small enough for localStorage across mobile browsers.
  if(out.length > 90000) out = canvas.toDataURL("image/jpeg", .5);
  if(out.length > 90000){
    const smaller = document.createElement("canvas");
    const ratio = 160 / Math.max(w, h);
    smaller.width = Math.max(1, Math.round(w * ratio));
    smaller.height = Math.max(1, Math.round(h * ratio));
    const sctx = smaller.getContext("2d", { alpha:false });
    if(!sctx) throw new Error("Canvas unavailable");
    sctx.drawImage(canvas, 0, 0, smaller.width, smaller.height);
    out = smaller.toDataURL("image/jpeg", .5);
  }
  return out;
}

async function getPhotoData(settings){
  if(settings?.photoData) return settings.photoData;
  if(settings?.photoId){
    try {
      const f = await fileDB.get(settings.photoId);
      if(f){
        const blob = new Blob([f.data], {type:f.type || "image/*"});
        return await fileToDataURL(blob);
      }
    } catch(e){}
  }
  return "";
}

/* ============ DATE / TIME ============ */
function isoDate(d){ const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); }
function timeToMin(t){ const [h,m] = t.split(":").map(Number); return h*60+m; }
function minToTime(m){ const h = Math.floor(m/60), mm = m%60; return `${String(h).padStart(2,"0")}:${String(mm).padStart(2,"0")}`; }
function addMinutes(t,m){ return minToTime(timeToMin(t) + m); }
function fmtHours(min){ const h = min/60; return h ? h.toFixed(1)+"h" : "0h"; }
function fmtHMS(s){ const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), ss = s%60; return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(ss).padStart(2,"0")}`; }
function shortDate(iso){ if(!iso) return ""; const d = new Date(iso); return d.toLocaleDateString(undefined, { month:"short", day:"numeric" }); }
function getWeekStart(date){
  const d = new Date(date); d.setHours(0,0,0,0);
  const day = d.getDay();
  const diff = state.settings.timetable.weekStart === "Sun" ? day : (day === 0 ? 6 : day - 1);
  d.setDate(d.getDate() - diff);
  return d;
}
function weekdayName(d){ return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()]; }

    const n = Number(v);
    return Number.isFinite(n) ? Math.max(0, n) : 0;
  };
  const safeTime = v => {
    const raw = String(v || "").trim();
    const m = raw.match(/^(\d{1,2}):(\d{2})$/);
    if(!m) return null;
    const h = Number(m[1]), min = Number(m[2]);
    return h >= 0 && h <= 23 && min >= 0 && min <= 59 ? h * 60 + min : null;
  };
  const todaysEvents = (state.timetableEvents || [])
    .filter(e => e && e.day === todayName)
    .map(e => ({...e, _startMin:safeTime(e.startTime), _endMin:safeTime(e.endTime)}))

    .sort((a,b) => a._startMin - b._startMin);
  const todaysSessions = (state.studySessions || []).filter(s => sessionDateKey(s) === todayStr);

    .filter(s => {

      <div class="stat"><div class="stat-label">This Week</div><div class="stat-value">${fmtHours(weeklyMin)}</div><div class="stat-sub">${dailyTarget ? "Target " + (dailyTarget*7) + "h" : "No daily target set"}</div></div>

/* ============ TIMETABLE ============ */
let ttView = "week";
let ttMonthYear = new Date().getFullYear();
let ttMonthMonth = new Date().getMonth();

function time12Parts(value){
  const [hh,mm] = String(value || "06:00").split(":").map(Number);
  const h24 = Number.isFinite(hh) ? hh : 6;
  const minute = Number.isFinite(mm) ? mm : 0;
  return { hour: h24 % 12 || 12, minute: Math.max(0, Math.min(59, minute)), ampm: h24 >= 12 ? "PM" : "AM" };
}
function time12Label(value){
  const p = time12Parts(value);
  return `${String(p.hour).padStart(2,"0")}:${String(p.minute).padStart(2,"0")} ${p.ampm}`;
}
function time12PickerHTML(prefix, value){
  const p = time12Parts(value);
  return `<span style="display:inline-flex;gap:4px;align-items:center;flex-wrap:nowrap">
    <select id="${prefix}Hour" class="tt-time-select" style="width:64px;min-width:64px" aria-label="${prefix} hour">${Array.from({length:12},(_,i)=>i+1).map(h=>`<option value="${h}" ${h===p.hour?"selected":""}>${String(h).padStart(2,"0")}</option>`).join("")}</select>
    <span class="muted">:</span>
    <select id="${prefix}Minute" class="tt-time-select" style="width:64px;min-width:64px" aria-label="${prefix} minute">${Array.from({length:60},(_,i)=>i).map(m=>`<option value="${m}" ${m===p.minute?"selected":""}>${String(m).padStart(2,"0")}</option>`).join("")}</select>
    <select id="${prefix}AmPm" class="tt-time-select" style="width:72px;min-width:72px" aria-label="${prefix} AM or PM"><option value="AM" ${p.ampm==="AM"?"selected":""}>AM</option><option value="PM" ${p.ampm==="PM"?"selected":""}>PM</option></select>
  </span>`;
}
function time12Value(prefix, rootEl){
  let h = parseInt(rootEl.querySelector(`#${prefix}Hour`).value, 10);
  const m = parseInt(rootEl.querySelector(`#${prefix}Minute`).value, 10);
  const ap = rootEl.querySelector(`#${prefix}AmPm`).value;
  if(h === 12) h = 0;
  if(ap === "PM") h += 12;
  return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
}
function setTime12Picker(prefix, value, rootEl){
  const p = time12Parts(value);
  rootEl.querySelector(`#${prefix}Hour`).value = String(p.hour);
  rootEl.querySelector(`#${prefix}Minute`).value = String(p.minute);
  rootEl.querySelector(`#${prefix}AmPm`).value = p.ampm;
}

function renderWeekView(container, tt, dayNames, todayName){

  requestAnimationFrame(() => drawNowLine(container, tt));
  container.querySelectorAll("td.slot").forEach(td => td.addEventListener("click", e => { if(e.target.closest(".event-chip")) return; openEventModal(null, { day: td.dataset.day, startTime: td.dataset.start }); }));
  container.querySelectorAll(".event-chip").forEach(ch => ch.addEventListener("click", e => { e.stopPropagation(); openEventModal(ch.dataset.id); }));
  const todayBtn = document.getElementById("ttToday");
  if(todayBtn) todayBtn.addEventListener("click", () => { const el = container.querySelector(".today-col") || container.querySelector(".timetable th.today"); if(el) el.scrollIntoView({ behavior:"smooth", block:"center", inline:"center" }); });
  const printBtn = document.getElementById("ttPrint");
  if(printBtn) printBtn.addEventListener("click", () => window.print());
}
function renderMonthView(container){
  const y = ttMonthYear, m = ttMonthMonth;
  const firstDay = new Date(y, m, 1);
  const daysInMonth = new Date(y, m+1, 0).getDate();
  const monthLabel = firstDay.toLocaleDateString(undefined, { month:"long", year:"numeric" });
  const lbl = document.getElementById("ttMonthLabel"); if(lbl) lbl.textContent = monthLabel;
  document.getElementById("ttPrevMonth").addEventListener("click", () => { ttMonthMonth--; if(ttMonthMonth < 0){ ttMonthMonth = 11; ttMonthYear--; } renderTimetable(document.getElementById("content")); });
  document.getElementById("ttNextMonth").addEventListener("click", () => { ttMonthMonth++; if(ttMonthMonth > 11){ ttMonthMonth = 0; ttMonthYear++; } renderTimetable(document.getElementById("content")); });
  document.getElementById("ttCurMonth").addEventListener("click", () => { const d = new Date(); ttMonthYear = d.getFullYear(); ttMonthMonth = d.getMonth(); renderTimetable(document.getElementById("content")); });
  const weekStart = state.settings.timetable.weekStart;
  const dayNames = weekStart === "Sun" ? ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"] : ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const dow = firstDay.getDay();
  const offset = weekStart === "Sun" ? dow : (dow === 0 ? 6 : dow - 1);
  const todayStr = isoDate(new Date());
  let cells = "";
  for(let i = 0; i < offset; i++) cells += `<div class="cal-cell other"></div>`;
  for(let d = 1; d <= daysInMonth; d++){
    const date = new Date(y, m, d);
    const dayName = weekdayName(date);
    const events = state.timetableEvents.filter(e => e.day === dayName).sort((a,b) => a.startTime.localeCompare(b.startTime));
    const isToday = isoDate(date) === todayStr;
    cells += `<div class="cal-cell ${isToday?"today":""}" data-date="${isoDate(date)}" data-day="${dayName}">
      <div class="cal-date">${d}</div>
      <div class="cal-events">
        ${events.slice(0,3).map(e => `<div class="cal-event" style="background:${e.color||subjectColor(e.subjectId)}" title="${esc(e.title||"")} ${e.startTime}–${e.endTime}">${e.startTime} ${esc(e.title||"Event")}</div>`).join("")}
        ${events.length > 3 ? `<div class="cal-more">+${events.length-3} more</div>` : ""}
      </div>
    </div>`;
  }
  let total = offset + daysInMonth;
  while(total % 7 !== 0){ cells += `<div class="cal-cell other"></div>`; total++; }
  container.innerHTML = `<div class="card calendar-scroll"><div class="cal-grid">${dayNames.map(d => `<div class="cal-head">${d}</div>`).join("")}${cells}</div></div>`;
  container.querySelectorAll(".cal-cell[data-date]").forEach(cell => cell.addEventListener("click", () => openDayModal(cell.dataset.date, cell.dataset.day)));
}
function openDayModal(dateStr, dayName){
  const events = state.timetableEvents.filter(e => e.day === dayName).sort((a,b) => a.startTime.localeCompare(b.startTime));
  const d = new Date(dateStr + "T00:00");
  openModal({
    title: d.toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric", year:"numeric" }),
    bodyHTML: events.length === 0 ? `<div class="empty">No events on ${dayName}.</div>` : events.map(e => `
      <div class="q-row" style="cursor:pointer" data-ev-id="${e.id}">
        <span style="width:10px;height:10px;border-radius:50%;background:${e.color||subjectColor(e.subjectId)};flex-shrink:0"></span>
        <span class="q-num">${e.startTime}</span>
        <span style="flex:1">${esc(e.title||subjectName(e.subjectId)||"Event")}</span>
        <span class="muted">${e.endTime}${e.type?" • "+esc(e.type):""}</span>
      </div>`).join(""),
    footerHTML: `<button class="btn ghost" data-close="1">Close</button><button class="btn primary" id="dayAdd">+ Add Event</button>`,
    onMount: (body, footer) => {
      footer.querySelector("[data-close]").addEventListener("click", closeModal);
      footer.querySelector("#dayAdd").addEventListener("click", () => { closeModal(); openEventModal(null, { day: dayName, startTime: "08:00" }); });
      body.querySelectorAll("[data-ev-id]").forEach(row => row.addEventListener("click", () => { closeModal(); openEventModal(row.dataset.evId); }));
    }
  });
}
function buildSlots(start, end, interval){
  const out = []; let cur = timeToMin(start); const endMin = timeToMin(end);
  if(endMin <= cur || interval <= 0) return out;
  while(cur < endMin){
    const next = Math.min(cur + interval, endMin);
    out.push({ start: minToTime(cur), end: minToTime(next), label: minToTime(cur) });
    cur = next;
  }
  return out;
}
function eventsInSlot(day, start, end){
  const s = timeToMin(start), e = timeToMin(end);
  return state.timetableEvents.filter(ev => ev.day === day).filter(ev => { const es = timeToMin(ev.startTime), ee = timeToMin(ev.endTime); return es < e && ee > s; }).sort((a,b) => a.startTime.localeCompare(b.startTime));
}
function eventChipHTML(e){
  const c = e.color || subjectColor(e.subjectId) || "#94a3b8";
  return `<span class="event-chip" data-id="${e.id}" style="background:${c}">${esc(e.title||subjectName(e.subjectId)||"Event")}<small>${e.startTime}–${e.endTime}</small></span>`;
}
function drawNowLine(rootEl, tt){
  const wrap = rootEl.querySelector(".timetable-wrap");
  if(!wrap) return;
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  const startMin = timeToMin(tt.start), endMin = timeToMin(tt.end);
  if(nowMin < startMin || nowMin > endMin) return;
  const firstSlot = wrap.querySelector("tbody td.slot");
  if(!firstSlot) return;
  const slotH = firstSlot.getBoundingClientRect().height;
  const rowsAbove = Math.floor((nowMin - startMin) / tt.interval);
  const frac = ((nowMin - startMin) % tt.interval) / tt.interval;
  const top = rowsAbove * slotH + frac * slotH;
  const dayIndex = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].indexOf(weekdayName(now));
  if(dayIndex < 0) return;
  const ths = wrap.querySelectorAll("thead th");
  let left = ths[0].getBoundingClientRect().width;
  for(let i = 1; i <= dayIndex; i++) left += ths[i].getBoundingClientRect().width;
  const width = ths[dayIndex+1].getBoundingClientRect().width;
  const line = document.createElement("div");
  line.className = "now-line";
  line.style.top = top + "px"; line.style.left = left + "px"; line.style.width = width + "px";
  wrap.appendChild(line);
}

/* ============ STREAM SUBJECT HELPERS ============ */
const IT_SUBJECT = ["Information & Communication Technology","#8b5cf6","💻"];
const STREAM_SUBJECT_ALIASES = {
  "Physical Science":["combined mathematics","combined maths","maths","mathematics","physics","chemistry","information & communication technology","information technology","ict","it"],
  "Biological Science":["biology","bio","chemistry","physics"],
  "Commerce":["accounting","accounts","business studies","business","economics","information & communication technology","information technology","ict","it"],
  "Arts":["history","geography","political science","politics","economics","logic & scientific method","logic and scientific method","civic education","sinhala","english literature","buddhist civilization","information & communication technology","information technology","ict","it"],
  "Technology":["engineering technology","science for technology","information & communication technology","information technology","ict","it","technology"]
};
const STREAM_SUBJECT_PRESETS = {
  "Physical Science":[["Combined Mathematics","#3b6ef6","📐"],["Physics","#8b5cf6","⚛️"],["Chemistry","#10b981","🧪"],IT_SUBJECT],
  "Biological Science":[["Biology","#16a34a","🧬"],["Chemistry","#10b981","🧪"],["Physics","#8b5cf6","⚛️"]],
  "Commerce":[["Accounting","#0ea5e9","💰"],["Business Studies","#f59e0b","💼"],["Economics","#8b5cf6","📈"],IT_SUBJECT],
  "Arts":[["History","#b45309","📜"],["Geography","#16a34a","🌍"],["Political Science","#3b6ef6","🏛️"],["Economics","#8b5cf6","📈"],IT_SUBJECT],
  "Technology":[["Engineering Technology","#2563eb","⚙️"],["Science for Technology","#10b981","🔬"],["Information & Communication Technology","#8b5cf6","💻"]]
};
function ensureStreamSubjects() {
  if(!state || !Array.isArray(state.subjects)) return false;
  const presets = STREAM_SUBJECT_PRESETS[String(state.settings.stream || "").trim()] || [];
  if(!presets.length) return false;
  let changed = false;
  for(const [name,color,icon] of presets){
    const normalizedName = normalizeSubjectName(name);
    const deleted = Array.isArray(state.settings.deletedStarterSubjects) && state.settings.deletedStarterSubjects.includes(normalizedName);
    const exists = state.subjects.some(s => normalizeSubjectName(s.name) === normalizedName);
    if(!exists && !deleted){ state.subjects.push({id:uid("sub"), name, color, icon}); changed = true; }
  }
  if(changed) saveData();
  return changed;
}
function normalizeSubjectName(name){ return String(name||"").toLowerCase().replace(/&/g," and ").replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim(); }
function subjectMatchesStream(subjectName, stream){
  const aliases = STREAM_SUBJECT_ALIASES[stream] || [];
  const n = normalizeSubjectName(subjectName);
  return aliases.some(a=>{const x=normalizeSubjectName(a);return n===x || n.includes(x) || x.includes(n);});
}
function librarySubjectsForStream(){
  const stream=String(state.settings.stream||"").trim();
  const relevant=state.subjects.filter(s=>subjectMatchesStream(s.name,stream));
  const other=state.subjects.filter(s=>!subjectMatchesStream(s.name,stream));
  return {stream,relevant,other};
}
function subjectFilterOptions(selected=""){
  const {stream,relevant,other}=librarySubjectsForStream();
  const label=stream && STREAM_SUBJECT_ALIASES[stream] ? `All ${stream} Subjects` : "All My Subjects";
  const relevantHtml=relevant.map(s=>`<option value="${esc(s.id)}" ${s.id===selected?"selected":""}>${esc(s.name)}</option>`).join("");
  const otherHtml=other.length?`<optgroup label="Other saved subjects">${other.map(s=>`<option value="${esc(s.id)}" ${s.id===selected?"selected":""}>${esc(s.name)}</option>`).join("")}</optgroup>`:"";
  return `<option value="">${label}</option>${relevantHtml}${otherHtml}`;
}
function streamSubjectChips(){
  const {stream,relevant}=librarySubjectsForStream();
  if(!relevant.length) return `<span class="library-subject-note">Add your ${esc(stream||"stream")} subjects in Settings to see them here.</span>`;
  return `<div class="library-subject-chips">${relevant.map(s=>`<button type="button" class="library-subject-chip" data-subject-filter="${esc(s.id)}" style="--chip-color:${esc(s.color||"#94a3b8")}"><span style="background:${esc(s.color||"#94a3b8")}"></span>${esc(s.name)}</button>`).join("")}</div>`;
}

function renderFormulaList(){
  const list=document.getElementById("formulaList"); if(!list) return;

  let items=state.formulas.slice();
  if(subject) items=items.filter(f=>f.subjectId===subject);
  if(chapter) items=items.filter(f=>f.chapter===chapter);
  if(favoritesOnly) items=items.filter(f=>f.favorite);
  if(q){const n=q.toLowerCase();items=items.filter(f=>[f.title,f.formulaLatex,f.explanation,f.variables,f.example,f.notes,f.chapter,f.topic,subjectName(f.subjectId)].filter(Boolean).some(v=>String(v).toLowerCase().includes(n)));}
  if(sort==="az") items.sort((a,b)=>(a.title||"").localeCompare(b.title||""));
  else if(sort==="fav") items.sort((a,b)=>(b.favorite?1:0)-(a.favorite?1:0)||(b.createdAt||"").localeCompare(a.createdAt||""));
  else items.sort((a,b)=>(b.createdAt||"").localeCompare(a.createdAt||""));
  if(items.length===0){list.innerHTML=`<div class="fm-empty"><strong>${state.formulas.length?"No formulas match your filters":"Build your formula library"}</strong><span>${state.formulas.length?"Try another search or clear a filter.":"Add formulas with a title and live-rendered LaTeX preview."}</span></div>`;return;}

  const subjectOrder = state.subjects.map(s=>s.id);

  });
  subjectOrder.forEach(id=>{ if(grouped.has(id)){ groups.push({id, name:subjectName(id), color:subjectColor(id), items:grouped.get(id)}); grouped.delete(id); } });
  if(grouped.has("__general__")){ groups.push({id:"__general__", name:"General / No Subject", color:"#94a3b8", items:grouped.get("__general__")}); grouped.delete("__general__"); }

  }));
}

/* ============ STUDY TRACKER ============ */
let timerInterval = null;
let timerStart = null;
let timerState = { subjectId:"", topic:"" };
let timerElapsedBeforePause = 0;
let timerPaused = false;

function sessionMinutes(s){
  const n = Number(s?.duration);
  return Number.isFinite(n) && n > 0 ? n : 0;
}
function sessionDateKey(s){
  if(s?.date && /^\d{4}-\d{2}-\d{2}$/.test(String(s.date))) return String(s.date);
  if(s?.startedAt){ const d = new Date(s.startedAt); if(!Number.isNaN(d.getTime())) return isoDate(d); }
  return "";
}
function sessionSortValue(s){
  if(s?.endedAt){ const d = new Date(s.endedAt); if(!Number.isNaN(d.getTime())) return d.getTime(); }
  if(s?.startedAt){ const d = new Date(s.startedAt); if(!Number.isNaN(d.getTime())) return d.getTime(); }
  const d = sessionDateKey(s); return d ? new Date(d+"T00:00:00").getTime() : 0;
}
function formatSessionDate(s){
  const d = sessionDateKey(s); return d ? shortDate(d) : "Unknown date";
}
function timerElapsedSeconds(){
  if(!timerStart) return Math.max(0, timerElapsedBeforePause);
  return Math.max(0, timerElapsedBeforePause + Math.floor((Date.now() - timerStart) / 1000));
}
function persistActiveTimer(){
  if(!state?.settings) return;
  state.settings.activeTimer = timerStart ? {
    subjectId: timerState.subjectId || "",
    topic: timerState.topic || "",
    startedAt: timerStart,
    elapsedBeforePause: timerElapsedBeforePause || 0,
    paused: !!timerPaused
  } : null;
  saveData();
}
function restoreActiveTimer(){
  const t = state?.settings?.activeTimer;
  if(!t || !t.subjectId || !t.startedAt) return false;
  const start = Number(t.startedAt);
  if(!Number.isFinite(start) || start <= 0) return false;
  timerStart = t.paused ? null : start;
  timerState = { subjectId:String(t.subjectId), topic:String(t.topic || "") };
  timerElapsedBeforePause = Number.isFinite(Number(t.elapsedBeforePause)) ? Math.max(0, Number(t.elapsedBeforePause)) : 0;
  timerPaused = !!t.paused;
  return true;
}
function clearActiveTimerPersistence(){
  if(state?.settings){ state.settings.activeTimer = null; saveData(); }
}
function timerDisplayText(){ return fmtHMS(timerElapsedSeconds()); }

function renderStudy(rootEl){
  ensureStreamSubjects();
  if(timerStart === null && !timerPaused) restoreActiveTimer();
  const now = new Date();
  const todayStr = isoDate(now);
  const weekStartStr = isoDate(getWeekStart(now));
  const monthStartStr = isoDate(new Date(now.getFullYear(), now.getMonth(), 1));
  const todays = state.studySessions.filter(s => sessionDateKey(s) === todayStr);
  const todayMin = todays.reduce((a,s) => a + sessionMinutes(s), 0);
  const weeklyMin = state.studySessions.filter(s => sessionDateKey(s) >= weekStartStr && sessionDateKey(s) <= todayStr).reduce((a,s) => a + sessionMinutes(s), 0);
  const monthlyMin = state.studySessions.filter(s => sessionDateKey(s) >= monthStartStr && sessionDateKey(s) <= todayStr).reduce((a,s) => a + sessionMinutes(s), 0);
  const targetMin = Math.max(0, Number(state.settings.dailyTarget) || 0) * 60;
  const targetPct = targetMin ? Math.min(100, Math.round((todayMin / targetMin) * 100)) : 0;
  const bySubject = state.subjects.map(s => ({ subject: s, min: state.studySessions.filter(x => x.subjectId === s.id).reduce((a,x) => a + sessionMinutes(x), 0) })).sort((a,b) => b.min - a.min);
  const topSubjectMin = bySubject[0]?.min || 0;
  const recent = state.studySessions.slice().sort((a,b) => sessionSortValue(b) - sessionSortValue(a)).slice(0,10);
  const running = !!timerStart;

      <div class="form-row inline"><div><label>Subject</label><select id="tmSubject"><option value="">${state.subjects.length ? "— Select subject —" : "No subjects available"}</option>${state.subjects.map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join("")}</select></div><div><label>Topic</label><input id="tmTopic" /></div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
        <button class="btn primary" id="tmStart" ${running||paused?"disabled":""}>▶ Start</button>
        <button class="btn" id="tmPause" ${running?"":"disabled"}>${paused?"▶ Resume":"⏸ Pause"}</button>

        <button class="btn" id="tmManual">+ Manual Session</button>
      </div>
      ${running||paused ? `<div class="muted" style="margin-top:10px">${paused ? "Timer paused. Resume when you're ready." : "Timer keeps using real elapsed time even when the browser tab is inactive."}</div>` : `<div class="muted" style="margin-top:10px">Start a timer, pause it when needed, and stop to save the session automatically.</div>`}
    </div>
    <div class="card" style="margin-bottom:16px"><div class="section-title"><h2>Subject-wise Study Time</h2><span class="muted">${bySubject.filter(x => x.min > 0).length} active</span></div>

    <div class="card"><div class="section-title"><h2>Recent Sessions</h2><span class="muted">${state.studySessions.length} total</span></div>
      ${recent.length === 0 ? `<div class="empty">No study sessions yet.</div>` : recent.map(s => `<div style="display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--border)"><span style="width:8px;height:8px;border-radius:50%;background:${subjectColor(s.subjectId)};flex-shrink:0"></span><div style="flex:1;min-width:0"><div style="font-size:13.5px;font-weight:600">${esc(subjectName(s.subjectId))}${s.topic?" • "+esc(s.topic):""}</div><div class="muted">${formatSessionDate(s)} • ${fmtHours(sessionMinutes(s))}${s.notes?" • "+esc(s.notes):""}</div></div><button class="btn small" data-edit-session="${esc(s.id||"")}" ${s.id?"":"disabled"}>Edit</button><button class="btn small danger" data-del-session="${esc(s.id||"")}" ${s.id?"":"disabled"}>×</button></div>`).join("")}</div>`;

  const subEl = rootEl.querySelector("#tmSubject");
  const topicEl = rootEl.querySelector("#tmTopic");
  if(timerState.subjectId && state.subjects.some(s => s.id === timerState.subjectId)) subEl.value = timerState.subjectId;
  if(timerState.topic) topicEl.value = timerState.topic;
  subEl.addEventListener("change", () => { timerState.subjectId = subEl.value; persistActiveTimer(); });
  topicEl.addEventListener("input", () => { timerState.topic = topicEl.value.trim(); });
  rootEl.querySelector("#tmStart").addEventListener("click", startTimer);
  rootEl.querySelector("#tmPause").addEventListener("click", toggleTimerPause);
  rootEl.querySelector("#tmStop").addEventListener("click", stopTimer);
  rootEl.querySelector("#tmReset").addEventListener("click", resetTimer);
  rootEl.querySelector("#tmManual").addEventListener("click", () => openSessionModal());
  rootEl.querySelectorAll("[data-edit-session]").forEach(b => b.addEventListener("click", () => openSessionModal(b.dataset.editSession)));
  rootEl.querySelectorAll("[data-del-session]").forEach(b => b.addEventListener("click", async () => { const id=b.dataset.delSession; if(!id) return; if(await confirmDialog("Delete session?", "Cannot be undone.")){ deleteData("studySessions", id); render(); toast("Deleted", "success"); } }));
  if(running || paused) startTimerTicking();
}
function startTimer(){
  if(timerStart || timerPaused) return;
  const sub = document.getElementById("tmSubject")?.value || "";
  const topic = document.getElementById("tmTopic")?.value.trim() || "";
  if(!sub) return toast("Select a subject", "error");
  timerState = { subjectId: sub, topic };
  timerStart = Date.now();
  timerElapsedBeforePause = 0;
  timerPaused = false;
  persistActiveTimer();
  startTimerTicking();
  render();
  toast("Timer started", "success");
}
function startTimerTicking(){
  if(timerInterval) clearInterval(timerInterval);
  updateTimerUI();
  timerInterval = setInterval(updateTimerUI, 1000);
}
function updateTimerUI(){
  const el = document.getElementById("timerDisplay");
  if(el) el.textContent = timerDisplayText();
  const status = document.getElementById("timerStatus");
  if(status) status.textContent = timerStart ? "Running" : timerPaused ? "Paused" : "Ready";
}
function toggleTimerPause(){
  if(!timerStart && !timerPaused) return;
  if(timerStart){
    timerElapsedBeforePause = timerElapsedSeconds();
    timerStart = null;
    timerPaused = true;
    persistActiveTimer();
    startTimerTicking();
    render();
    toast("Timer paused", "success");
    return;
  }
  timerStart = Date.now();
  timerPaused = false;
  persistActiveTimer();
  startTimerTicking();
  render();
  toast("Timer resumed", "success");
}
async function resetTimer(){
  if(!timerStart && !timerPaused) return;
  if(!(await confirmDialog("Reset timer?", "The current unsaved timer will be discarded."))) return;
  stopTimerSilent();
  render();
  toast("Timer reset", "success");
}
function stopTimer(){
  if(!timerStart && !timerPaused) return;
  const secs = timerElapsedSeconds();
  const minutes = Math.max(1, Math.round(secs / 60));
  const startedMs = timerStart ? timerStart : (timerPaused ? Date.now() - (timerElapsedBeforePause*1000) : Date.now());
  const startedDate = new Date(startedMs);
  const endedDate = new Date();
  addItem("studySessions", {
    subjectId: timerState.subjectId,
    topic: timerState.topic,
    duration: minutes,
    date: isoDate(startedDate),
    notes: "",
    startedAt: startedDate.toISOString(),
    endedAt: endedDate.toISOString()
  });
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = null;
  timerStart = null;
  timerElapsedBeforePause = 0;
  timerPaused = false;
  timerState = { subjectId:"", topic:"" };
  clearActiveTimerPersistence();
  toast(`Saved ${minutes} min`, "success");
  render();
}

  const s = editing || { subjectId:state.subjects[0]?.id||"", topic:"", duration:60, date:isoDate(new Date()), notes:"" };
  openModal({
    title: editing ? "Edit Study Session" : "Add Study Session",
    bodyHTML: `
      <div class="form-row"><label>Subject</label><select id="seSubject"><option value="">— None —</option>${state.subjects.map(x => `<option value="${x.id}" ${x.id===s.subjectId?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div>

/* ============ BACKUP (per profile) ============ */
function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], { type:"application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const safeName = (state.settings.studentName || "profile").replace(/[^a-z0-9_-]/gi, "_");
  a.href = url;
  a.download = `al-study-planner-${safeName}-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast("Exported", "success");
}
function importData(text){
  try {
    const parsed = JSON.parse(text);
    if(!parsed || typeof parsed !== "object" || Array.isArray(parsed)) throw new Error("Not an object");
    const req = ["settings","subjects","timetableEvents","formulas","notes","studySessions"];
    for(const k of req){ if(!(k in parsed)) throw new Error("Missing key: " + k); if(k !== "settings" && !Array.isArray(parsed[k])) throw new Error("Invalid: " + k); }
    state = deepMerge(cloneDefaultState(), parsed);
    saveData(); applyTheme(); applyAccent(); syncProfileMeta(); render();
    toast("Imported", "success");
    return true;
  } catch(e){
    console.error("importData:", e);
    toast("Invalid JSON: " + e.message, "error");
    return false;
  }
}

async function switchProfile(){
  syncProfileMeta();
  if(window.ALStudyPlannerCloud?.enabled && activeAuth){
    saveData();
    await flushCloudSave();
    try { await window.ALStudyPlannerCloud.logout(); } catch(e){ console.error("Cloud logout failed:", e); }
  } else {
    saveData();
  }
  stopTimerSilent();
  root.current = null;
  saveRoot();
  activeAuth = false;
  profileId = null;
  cloudProfile = null;
  state = null;
  currentRoute = "dashboard";
  location.hash = "";
  closeModal();
  closeSidebarOnMobile();
  renderGate("login");
}
async function logoutProfile(){
  syncProfileMeta();
  if(window.ALStudyPlannerCloud?.enabled && activeAuth){
    saveData();
    await flushCloudSave();
    try { await window.ALStudyPlannerCloud.logout(); } catch(e){ console.error("Cloud logout failed:", e); }
  } else {
    saveData();
  }
  stopTimerSilent();
  root.current = null;
  saveRoot();
  activeAuth = false;
  profileId = null;
  cloudProfile = null;
  state = null;
  currentRoute = "dashboard";
  closeModal();

async function deleteProfile(){
  const p = getActiveProfileMeta();
  if(!p) return;
  if(!await confirmDialog("Delete profile \"" + (p.name || "Account") + "\"?", "This profile's data will be permanently removed. Cannot be undone.")) return;
  if(window.ALStudyPlannerCloud?.enabled && activeAuth){
    try {
      await flushCloudSave();
      await window.ALStudyPlannerCloud.deleteAccount(window.ALStudyPlannerCloud.user?.uid || profileId);
    } catch(e){
      console.error("Cloud delete failed:", e);
      return toast("Account could not be deleted. Please sign in again and retry.", "error");
    }
    storageRemove(profileDataKey(profileId));
    root.profiles = root.profiles.filter(x => x.id !== profileId);
    root.current = null;
    saveRoot();
    activeAuth = false;
    profileId = null;
    cloudProfile = null;
    state = null;
    stopTimerSilent();
    location.hash = "";
    renderGate("welcome");
    return;
  }
  if(state?.settings?.photoId){ try { await fileDB.delete(state.settings.photoId); } catch(e){} }
  storageRemove(profileDataKey(profileId));
  root.profiles = root.profiles.filter(x => x.id !== profileId);
  root.current = null;
  saveRoot();
  profileId = null;
  stopTimerSilent();
  location.hash = "";
  renderGate(root.profiles.length ? "picker" : "welcome");
}
