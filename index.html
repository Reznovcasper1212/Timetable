        <p class="gate-sub">Enter your own username and password. No profile list is shown.</p>
        <div class="form-row" style="text-align:left">
          <label>Username</label>
          <input id="gateLoginUsername" placeholder="Your username" autocomplete="username" autocapitalize="none" spellcheck="false" autofocus />
        </div>
        <div class="form-row" style="text-align:left">
          <label>Password</label>
          <input id="gateLoginPassword" type="password" placeholder="Your password" autocomplete="current-password" />
        </div>
        <button class="btn primary" id="gateLogin" style="width:100%;margin-top:4px">Sign In <span style="font-size:16px">→</span></button>
        <button class="btn ghost" id="gateNew" style="width:100%;margin-top:8px">+ Create New Account</button>
        ${root.profiles.some(p => !p.passHash && !p.username) ? `<button class="btn ghost" id="gateLegacy" style="width:100%;margin-top:4px">🔐 Secure Existing Account</button>` : ""}
        <div class="gate-note muted">For privacy, the app no longer displays other account names/photos on the login screen. You must sign in each time the page is opened.</div>
      </div>`);

    const userInput = document.getElementById("gateLoginUsername");
    const passInput = document.getElementById("gateLoginPassword");

    [userInput,passInput].forEach(inp => inp.addEventListener("keydown", e => {
      if(e.key === "Enter") document.getElementById("gateLogin").click();
    }));

    document.getElementById("gateLogin").addEventListener("click", () => loginProfile(userInput.value, passInput.value));
    document.getElementById("gateNew").addEventListener("click", () => renderGate("welcome"));
    const legacyBtn = document.getElementById("gateLegacy");
    if(legacyBtn) legacyBtn.addEventListener("click", () => renderGate("secureLegacy"));
  }
}

async function verifyLocalCredentials(username, password){
  const p = profileByUsername(username);
  if(!p || !p.passHash || !p.passSalt) return null;
  const candidate = await hashPassword(password, p.passSalt);
  return candidate === p.passHash ? p : null;
}

async function createProfile(username, name, stream, password){
  const cleanUsername = normalizeUsername(username);
  const cleanName = String(name || "").trim();
  const cleanStream = String(stream || "").trim();
  if(!cleanUsername || !cleanName || !cleanStream || !password) return;

  const id = uid("p");
  const passSalt = randomHex(16);
  const passHash = await hashPassword(password, passSalt);
  const profile = {
    id,
    username: cleanUsername,
    name: cleanName,
    stream: cleanStream,
    examYear: "",
    photoData: "",
    passHash,
    passSalt,
    createdAt: new Date().toISOString()
  };
  const fresh = cloneDefaultState();
  fresh.settings.studentName = cleanName;
  fresh.settings.stream = cleanStream;

  if(window.ALStudyPlannerCloud?.enabled){
    try {
      const user = await window.ALStudyPlannerCloud.createAccount(cleanUsername, password, profile, fresh);
      profile.id = user.uid;
      delete profile.passHash;
      delete profile.passSalt;
      root.profiles = root.profiles.filter(p => p.username !== cleanUsername);
      root.profiles.push(profile);
      root.current = null;
      saveRoot();
      storageSet(profileDataKey(user.uid), JSON.stringify(fresh));
      cloudProfile = profile;
      activeAuth = true;
      profileId = user.uid;
      cloudSyncWarningShown = false;
      await startApp(user.uid, true);
      return;
    } catch(e){
      console.error("Cloud account creation failed:", e);
      const msg = e?.code === "auth/email-already-in-use" ? "That username is already used. Choose another one." : "Cloud account creation failed. Check your internet connection and Firebase setup.";
      return toast(msg, "error");
    }
  }

  root.profiles.push(profile);
  root.current = null;
  const rootOk = storageSet(ROOT_KEY, JSON.stringify(root));
  const dataOk = storageSet(profileDataKey(id), JSON.stringify(fresh));
  if(!rootOk || !dataOk) showStorageWarning();
  activeAuth = true;
  profileId = id;
  await startApp(id, true);
}

async function secureLegacyProfile(name, password, password2){
  const cleanName = String(name || "").trim();
  if(!cleanName) return toast("Enter your existing profile name.", "error");
  if(password.length < 6) return toast("Password must be at least 6 characters.", "error");
  if(password !== password2) return toast("Passwords do not match.", "error");

  const cleanUsername = normalizeUsername(cleanName);
  const matches = root.profiles.filter(p => (!p.passHash || !p.passSalt) && !p.username && normalizeUsername(p.name) === cleanUsername);
  if(matches.length !== 1) return toast("Existing profile not found.", "error");
  const p = matches[0];
  const localStateRaw = storageGet(profileDataKey(p.id));
  let localState = null;
  try { localState = localStateRaw ? normalizeState(JSON.parse(localStateRaw)) : cloneDefaultState(); } catch(e){ localState = cloneDefaultState(); }

  if(window.ALStudyPlannerCloud?.enabled){
    try {
      const oldLocalId = p.id;
      const user = await window.ALStudyPlannerCloud.createAccount(cleanUsername, password, p, localState);
      storageRemove(profileDataKey(oldLocalId));
      p.id = user.uid;
      p.username = cleanUsername;
      p.passHash = "";
      p.passSalt = "";
      saveRoot();
      storageRemove(profileDataKey(p.id));
      storageSet(profileDataKey(user.uid), JSON.stringify(localState));
      cloudProfile = { ...p, id:user.uid, username:cleanUsername };
      activeAuth = true;
      profileId = user.uid;
      await startApp(user.uid, true);
      return;
    } catch(e){
      console.error("Legacy cloud migration failed:", e);
      return toast(e?.code === "auth/email-already-in-use" ? "This username is already registered in the cloud." : "Could not secure this account online.", "error");
    }
  }

  const passSalt = randomHex(16);
  p.username = cleanUsername;
  p.passSalt = passSalt;
  p.passHash = await hashPassword(password, passSalt);
  root.current = null;
  saveRoot();
  activeAuth = true;
  profileId = p.id;
  await startApp(p.id, true);
}

async function loginProfile(username, password){
  const cleanUsername = normalizeUsername(username);
  if(!cleanUsername) return toast("Enter your username.", "error");
  if(!password) return toast("Enter your password.", "error");

  if(window.ALStudyPlannerCloud?.enabled){
    try {
      const user = await window.ALStudyPlannerCloud.signIn(cleanUsername, password);
      activeAuth = true;
      profileId = user.uid;
      cloudSyncWarningShown = false;
      await startApp(user.uid, true);
      return;
    } catch(e){
      console.error("Cloud login failed:", e);
      const localMatch = await verifyLocalCredentials(cleanUsername, password);
      const canMigrate = !!localMatch && ["auth/user-not-found","auth/invalid-credential","auth/wrong-password"].includes(e?.code);
      if(canMigrate){
        const localRaw = storageGet(profileDataKey(localMatch.id));
        let localState = null;
        try { localState = localRaw ? normalizeState(JSON.parse(localRaw)) : cloneDefaultState(); } catch(err){ localState = cloneDefaultState(); }
        try {
          const cloudUser = await window.ALStudyPlannerCloud.createAccount(cleanUsername, password, localMatch, localState);
          const meta = { ...localMatch, id: cloudUser.uid, username:cleanUsername };
          delete meta.passHash; delete meta.passSalt;
          root.profiles = root.profiles.filter(p => p.id !== localMatch.id && p.username !== cleanUsername);
          root.profiles.push(meta);
          saveRoot();
          storageSet(profileDataKey(cloudUser.uid), JSON.stringify(localState));
          cloudProfile = meta;
          activeAuth = true;
          profileId = cloudUser.uid;
          await startApp(cloudUser.uid, true);
          toast("Account moved to cloud sync.", "success");
          return;
        } catch(migErr){
          console.error("Cloud migration failed:", migErr);
        }
      }
      const msg = e?.code === "auth/network-request-failed" ? "No internet connection." : "Invalid username or password.";
      return toast(msg, "error");
    }
  }

  const p = await verifyLocalCredentials(cleanUsername, password);
  if(!p) return toast("Invalid username or password.", "error");
  root.current = null;
  saveRoot();
  activeAuth = true;
  profileId = p.id;
  await startApp(p.id, true);
}

/* ============ CLOUD/LOCAL APP START ============ */
async function startCloudApp(user, forceDashboard=true){
  if(!user){
    activeAuth = false;
    profileId = null;
    cloudProfile = null;
    state = null;
    renderGate("login");
    return;
  }
  profileId = user.uid;
  try {
    let remote = await window.ALStudyPlannerCloud.load(user.uid);
    if(!remote || !remote.profile || !remote.state){
      const cachedRaw = storageGet(profileDataKey(user.uid));
      const cachedMeta = root.profiles.find(p => p.id === user.uid) || null;
      if(cachedRaw){
        try {
          const cachedState = normalizeState(JSON.parse(cachedRaw));
          const meta = cachedMeta || { id:user.uid, username:"", name:cachedState.settings.studentName || "", stream:cachedState.settings.stream || "", examYear:cachedState.settings.examYear || "", photoData:cachedState.settings.photoData || "" };
          await window.ALStudyPlannerCloud.save(user.uid, meta, cachedState);
          remote = { profile:meta, state:cachedState };
        } catch(e){}
      }
    }
    if(!remote || !remote.state){
      throw new Error("Cloud account data not found.");
    }
    cloudProfile = { ...(remote.profile || {}), id:user.uid, username:normalizeUsername(remote.profile?.username || "") };
    state = normalizeState(remote.state);
    if(!state.settings.studentName) state.settings.studentName = cloudProfile.name || "";
    if(!state.settings.stream) state.settings.stream = cloudProfile.stream || "";
    if(!state.settings.examYear) state.settings.examYear = cloudProfile.examYear || "";
    if(!state.settings.photoData && cloudProfile.photoData) state.settings.photoData = cloudProfile.photoData;
    storageSet(profileDataKey(user.uid), JSON.stringify(state));
    // Keep a private local cache for offline recovery; it is never used as a login/account list in cloud mode.
    const cacheMeta = { ...cloudProfile };
    root.profiles = root.profiles.filter(p => p.id !== user.uid);
    root.profiles.push(cacheMeta);
    root.current = null;
    saveRoot();
  } catch(e){
    console.error("Cloud app load failed:", e);
    try { await window.ALStudyPlannerCloud.logout(); } catch(err){}
    activeAuth = false;
    profileId = null;
    cloudProfile = null;
    state = null;
    toast("Could not load your cloud data. Please check your internet connection.", "error");
    renderGate("login");
    return;
  }

  ensureStreamSubjects();
  const gateRoot = document.getElementById("gateRoot");
  gateRoot.innerHTML = "";
  gateRoot.style.display = "none";
  const app = document.getElementById("app");
  app.style.display = "flex";
  applyTheme();
  applyAccent();
  applyLibraryAppearance();
  getPhotoData(state.settings).then(data => {
    if(data && !state.settings.photoData){
      state.settings.photoData = data;
      syncProfileMeta();
      saveData();
    }
    syncProfileMeta();
    return refreshBrand();
  }).catch(()=>refreshBrand());
  setupShell();
  const initial = forceDashboard ? "dashboard" : (location.hash.replace("#","") || "dashboard");
  navigate(ROUTES[initial] ? initial : "dashboard");
}

/* ============ BOOT: START APP FOR PROFILE ============ */
async function startApp(id, forceDashboard=false){
  if(window.ALStudyPlannerCloud?.enabled){
    if(!activeAuth || !window.ALStudyPlannerCloud.user) {
      profileId = null;
      state = null;
      cloudProfile = null;
      renderGate("login");
      return;
    }
    return startCloudApp(window.ALStudyPlannerCloud.user, forceDashboard);
  }

  if(!activeAuth){
    profileId = null;
    state = null;
    renderGate(root.profiles.length ? "login" : "welcome");
    return;
  }
  const prof = root.profiles.find(p => p.id === id);
  if(!prof){
    activeAuth = false;
    profileId = null;
    state = null;
    renderGate(root.profiles.length ? "login" : "welcome");
    return;
  }

  profileId = id;
  root.current = null;
  saveRoot();
  try {
    const raw = storageGet(profileDataKey(id));
    if(!raw){
      state = cloneDefaultState();
      state.settings.studentName = prof.name || "";
      state.settings.stream = prof.stream || "";
      saveData();
    } else {
      state = normalizeState(JSON.parse(raw));
      if(!state.settings.studentName) state.settings.studentName = prof.name || "";
      if(!state.settings.stream) state.settings.stream = prof.stream || "";
      if(!state.settings.photoData && prof.photoData) state.settings.photoData = prof.photoData;
      saveData();
    }
  } catch(e){
    console.error("startApp load failed:", e);
    state = cloneDefaultState();
    state.settings.studentName = prof.name || "";
    state.settings.stream = prof.stream || "";
    state.settings.photoData = prof.photoData || "";
    saveData();
    toast("Saved profile data was damaged, so a clean profile state was loaded.", "error");
  }

  ensureStreamSubjects();
  const gateRoot = document.getElementById("gateRoot");
  gateRoot.innerHTML = "";
  gateRoot.style.display = "none";
  const app = document.getElementById("app");
  app.style.display = "flex";
  applyTheme();
  applyAccent();
  applyLibraryAppearance();
  getPhotoData(state.settings).then(data => {
    if(data && !state.settings.photoData){
      state.settings.photoData = data;
      syncProfileMeta();
      saveData();
    }
    syncProfileMeta();
    return refreshBrand();
  }).catch(()=>refreshBrand());
  setupShell();
  const initial = forceDashboard ? "dashboard" : (location.hash.replace("#","") || "dashboard");
  navigate(ROUTES[initial] ? initial : "dashboard");
}

/* ============ BOOTSTRAP ============ */
async function init(){
  activeAuth = false;
  profileId = null;
  cloudProfile = null;
  state = null;
  loadRoot();

  if(window.ALStudyPlannerCloud?.enabled){
    try {
      const user = await window.ALStudyPlannerCloud.authReady;
      if(user){
        activeAuth = true;
        profileId = user.uid;
        await startApp(user.uid, true);
        return;
      }
    } catch(e){
      console.error("Auth restore failed:", e);
    }
    renderGate("login");
    return;
  }

  if(root.profiles.length === 0){
    renderGate("welcome");
    return;
  }
  // Local fallback: never auto-open an account after refresh/reopen.
  root.current = null;
  saveRoot();
  renderGate("login");
}
document.addEventListener("DOMContentLoaded", init);
</script>
